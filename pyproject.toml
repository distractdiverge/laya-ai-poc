[project]
name = "laya-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Astrid 'Alex' Lapinski", email = "alex.lapinski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "typer>=0.27.2",
]

[project.scripts]
laya-ai = "laya_ai:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
