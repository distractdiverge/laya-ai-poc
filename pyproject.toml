[project]
name = "laya-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Astrid Lapinski", email = "the.astrid.solveig@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3",
    "todoist-api-python>=3.1.0,<4",
    "laya>=0.3.20,<1",
    "typer>=0.27.2",
]

[project.scripts]
laya-ai = "laya_ai:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration (require live Todoist API and credentials)",
]
addopts = "-m 'not integration'"
